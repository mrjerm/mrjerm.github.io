project:
  type: website
  output-dir: docs
  # Explicit render scope. Without this Quarto renders every .md in the repo too,
  # which published CLAUDE.md as a public page. Only .qmd/.ipynb are site pages.
  render:
    - "*.qmd"
    - "*.ipynb"
  resources:
    - "resume-engineering.pdf"
    - "resume-quant.pdf"

website:
  title: "Jeremy Hsu"
  # "algorithmic" is here deliberately. It never renders on screen (the home
  # page hides its title block), but it goes into <meta name="description"> and
  # og:description, where an ATS or a non-quant recruiter searching the more
  # common job-posting phrasing can match it. The visible copy stays
  # "systematic", which is the accurate term for the work.
  description: "Jeremy Hsu: Computer Science at Penn State. Systematic and algorithmic trading research, and the execution infrastructure that runs it."
  site-url: "https://mrjerm.github.io"
  favicon: favicon.svg
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    title: "Jeremy Hsu"
    left:
      - href: index.qmd
        text: Home
      - text: Work
        menu:
          - href: rime.qmd
            text: "Rime: ETF regime allocator"
          - href: fifth-sanctuary.qmd
            text: "Fifth Sanctuary: gold volatility expansion"
          - href: project_kintoun.ipynb
            text: "Kintoun: ORB microstructure research"
          - href: robotics.qmd
            text: "Competitive robotics"
      - href: about.qmd
        text: About
      - text: Resume
        menu:
          - href: resume-engineering.pdf
            text: "Software engineering"
          - href: resume-quant.pdf
            text: "Quantitative research"
    right:
      - icon: github
        href: https://github.com/mrjerm
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/jerm04/
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:jeremyhsu2025@gmail.com
        aria-label: Email
  page-footer:
    left: |
      © 2026 Jeremy Hsu · [jeremyhsu2025@gmail.com](mailto:jeremyhsu2025@gmail.com)
    center: |
      Performance figures on this site are simulated backtest results unless
      explicitly labeled otherwise. Simulated results have inherent limitations
      and do not represent actual trading. Past performance is not indicative of
      future results. Nothing here is an offer to sell or a solicitation of an
      offer to buy any security, or investment advice.
    right:
      - icon: github
        href: https://github.com/mrjerm
      - icon: linkedin
        href: https://www.linkedin.com/in/jerm04/

format:
  html:
    # Single dark theme. The Sept 2026 redesign is dark-only, so there is no
    # light bundle and consequently no colour-scheme toggle in the navbar.
    # theme-dark.scss was deleted in the same pass.
    theme: [cosmo, theme.scss]
    toc: true
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
    code-fold: true
    code-tools: false
    highlight-style: github
    # Set before first paint so the scroll-arrival rules in theme.scss can hide
    # their targets without a flash of visible content. With JS disabled the
    # class never lands and nothing is ever hidden.
    include-in-header:
      text: |
        <script>document.documentElement.classList.add("jh-js");</script>
    include-after-body:
      text: |
        <script
          src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"
          integrity="sha512-Kef5sc7gfTacR7TZKelcrRs15ipf7+t+n7Zh6mKNJbmW+/RRdCW9nwfLn4YX0s2nO6Kv5Y2ChqgIakaC6PW09A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer"></script>
        <script>
        (function () {
          var html = document.documentElement;
          var reduce = false;
          try {
            reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          } catch (e) {}

          // Scroll arrivals.
          try {
            if (reduce) {
              html.classList.remove("jh-js");
            } else {
              var rise = [].slice.call(document.querySelectorAll(".jh-rise"));
              if (!rise.length || !("IntersectionObserver" in window)) {
                html.classList.remove("jh-js");
              } else {
                var riseObs = new IntersectionObserver(function (entries) {
                  entries.forEach(function (e) {
                    if (!e.isIntersecting) return;
                    var el = e.target;
                    var sibs = el.parentNode
                      ? [].slice.call(el.parentNode.children)
                      : [];
                    el.style.transitionDelay =
                      Math.min(Math.max(sibs.indexOf(el), 0), 5) * 80 + "ms";
                    el.classList.add("is-in");
                    riseObs.unobserve(el);
                  });
                }, { rootMargin: "0px 0px -10% 0px", threshold: 0.08 });
                rise.forEach(function (el) { riseObs.observe(el); });
              }
            }
          } catch (err) {
            // Never let a motion bug cost anyone the content.
            html.classList.remove("jh-js");
          }

          // Dot navigation + navbar docking.
          try {
            var panels = [].slice.call(document.querySelectorAll(".panel[id]"));
            var dots = [].slice.call(document.querySelectorAll(".dot-nav a"));
            var navbar = document.querySelector(".navbar");

            if (panels.length && "IntersectionObserver" in window) {
              var navObs = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) {
                  if (!e.isIntersecting) return;
                  var id = e.target.id;
                  dots.forEach(function (d) {
                    // `.hash` rather than getAttribute("href"): the rendered
                    // href comes back resolved to an absolute URL, so a string
                    // compare against "#id" never matched and no dot ever lit.
                    var on = d.hash === "#" + id;
                    d.classList.toggle("is-active", on);
                    // The dot list is a nav landmark, so mark the current one
                    // for assistive tech and not only visually.
                    if (on) {
                      d.setAttribute("aria-current", "true");
                    } else {
                      d.removeAttribute("aria-current");
                    }
                  });
                  // The hero is the only panel the bar may float over
                  // transparently; everything below it needs a ground.
                  if (navbar) {
                    navbar.classList.toggle("is-docked", id !== "hero");
                  }
                });
              }, { threshold: 0.5 });
              panels.forEach(function (p) { navObs.observe(p); });
            }
          } catch (err) {}

          // Particle field. Guarded three ways: the container only exists on the
          // home page, the library is absent if the CDN is blocked or the SRI
          // check fails, and it is skipped entirely under reduced-motion (the
          // hero still reads fine — this is a background, not content).
          try {
            if (!reduce &&
                document.getElementById("particles-js") &&
                typeof window.particlesJS === "function") {
              window.particlesJS("particles-js", {
                particles: {
                  number: { value: 70, density: { enable: true, value_area: 900 } },
                  color: { value: "#99aec2" },
                  shape: { type: "circle" },
                  opacity: { value: 0.5, random: true, anim: { enable: false } },
                  size: { value: 2.2, random: true, anim: { enable: false } },
                  line_linked: {
                    enable: true,
                    distance: 150,
                    color: "#7d93a7",
                    opacity: 0.32,
                    width: 1
                  },
                  move: {
                    enable: true,
                    speed: 0.9,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out",
                    bounce: false
                  }
                },
                interactivity: {
                  // "window", not "canvas". #particles-js stays
                  // pointer-events:none so it can never claim a click meant for
                  // the hero links above it, which also means the canvas never
                  // receives mouse events of its own — binding to the window
                  // lets the field react to the pointer without intercepting it.
                  detect_on: "window",
                  events: {
                    onhover: { enable: true, mode: "grab" },
                    onclick: { enable: false },
                    resize: true
                  },
                  modes: {
                    grab: { distance: 170, line_linked: { opacity: 0.45 } }
                  }
                },
                retina_detect: true
              });
            }
          } catch (err) {}
        })();
        </script>

execute:
  enabled: false
